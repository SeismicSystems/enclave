[package]
name = "tdx-init"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6" }
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] } 
glob = "0.3.3"
hmac = "0.12.1"
nix = { version = "0.30.1", features = ["user", "fs"] }
rand = "0.9.2"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "process", "fs", "io-util"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
