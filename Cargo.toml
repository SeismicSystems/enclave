[workspace]
resolver = "2"
# The four deployed binaries live under bin/, next to `verify-quote`, which
# runs off-node in deploy's hands; every crates/ member is a library (some also
# build a tooling CLI behind their `cli` feature). The dir name is the crate;
# the arrow is the binary target it builds.
members = [
    "bin/tdx-init",              # -> tdx-init
    "bin/attestation-service",   # -> seismic-attestation-service
    "bin/custodian-service",     # -> seismic-custodian-service
    "bin/summit-key-holder",     # -> summit-key-holder
    "bin/verify-quote",          # -> verify-quote

    "crates/attestation",
    "crates/attestation-rpc",
    "crates/crypto",
    "crates/custodian",
    "crates/custodian-ipc",          # -> custodian-ipc-cli (CLI)
    "crates/measurement-admission",  # -> seismic-measurement-admission (CLI)
    "crates/measurement-registry-client",
    "crates/network-manifest",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
repository = "https://github.com/SeismicSystems/enclave"
homepage = "https://github.com/SeismicSystems/enclave"
authors = ["Seismic Systems"]
license = "MIT"
readme = "README.md"

[workspace.dependencies]
# workspace libs
seismic-attestation = { path = "crates/attestation" }
seismic-attestation-rpc = { path = "crates/attestation-rpc" }
seismic-crypto = { path = "crates/crypto" }
seismic-custodian = { path = "crates/custodian" }
seismic-custodian-ipc = { path = "crates/custodian-ipc", default-features = false }
seismic-custodian-service = { path = "bin/custodian-service" }
seismic-measurement-admission = { path = "crates/measurement-admission" }
seismic-measurement-registry-client = { path = "crates/measurement-registry-client" }
seismic-network-manifest = { path = "crates/network-manifest" }

# Other deps
alloy = "1.0"
alloy-contract = "1.0"
alloy-primitives = { version = "1.0", default-features = false, features = ["std", "serde"] }
alloy-sol-types = "1.0"
aes-gcm = "0.10"
anyhow = "1.0"
# Pointing to https://github.com/SeismicSystems/attested-tls/pull/2
attestation = { git = "https://github.com/SeismicSystems/attested-tls", rev = "2ce0feee147ef5ba071a9919a3fce80ef9643fd6" }
az-cvm-vtpm = { version = "0.7.4", default-features = false }
az-tdx-vtpm = "0.7.4"
axum = "0.8.6"
base64 = "0.22"
bincode = "1.3.3"
ciborium = "0.2"
clap = { version = "4.5.51", features = ["derive", "env"] }
dcap-rs = "0.1.0"
base64-url = "3.0.0"
thiserror = "2.0"
hex = "0.4.3"
hex-literal = "1"
hkdf = "0.12"
http-body-util = "0.1"
jsonrpsee = { version = "0.26.0", features = ["server", "client","macros"] }
libc = "0.2.177"
rand = "0.9.2"
# Provider choice for the process-level rustls default that attested-tls's
# collateral fetching requires the application to install.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
schnorrkel = { version = "0.11.2", features = ["serde"] }
secp256k1 = { version = "0.30", features = ["rand", "recovery", "std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
serial_test = "3.2.0"
sha2 = "0.10.9"
tempfile = "3.17"
tokio = { version = "1.44", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = { version = "0.1.41"}
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "json"] }
url = "2.5"
zeroize = "1.8.1"
