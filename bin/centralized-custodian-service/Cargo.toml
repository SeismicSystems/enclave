[package]
name = "seismic-centralized-custodian-service"
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Centralized custodian: security-council-delivered epoch keys served over the custodian socket"

# Binary target defaults to the package name, built from src/main.rs; the
# crate also exposes a lib (src/lib.rs) so integration tests can drive the
# state, dispatch, and council handler in-process.

[dependencies]
seismic-council-delivery = { workspace = true, features = ["http-client"] }
seismic-custodian.workspace = true
# Reused as a library only for its --allow grant parsing (`acl`); this
# standalone service has no bootstrap flow or LUKS handoff, so the base
# state/dispatch modules are not linked. Its custodian-ipc dependency is the
# no-tokio one below.
seismic-custodian-service.workspace = true
# Only the wire types plus the synchronous `server` transport are used; the
# async `client` is not linked. A path dependency rather than `workspace =
# true` because workspace inheritance cannot turn default features off.
seismic-custodian-ipc = { path = "../../crates/custodian-ipc", default-features = false, features = ["server"] }
seismic-network-manifest.workspace = true
seismic-observer-key.workspace = true

anyhow.workspace = true
bytes = "1"
clap.workspace = true
hex.workspace = true
# The council listener: hyper's HTTP/1.1 server on a single-threaded tokio
# runtime confined to one thread; everything else in the process is
# synchronous.
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand.workspace = true
secp256k1.workspace = true
tokio = { version = "1.44", features = ["net", "rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

[dev-dependencies]
# Tests drive the served socket with the async client.
seismic-custodian-ipc = { workspace = true, features = ["client"] }
tempfile = "3.17.1"
# Fake parent custodians in tests/http_observer.rs.
tiny_http.workspace = true
tokio.workspace = true
# Limit the real custodian subprocess in oversized-body crash regression tests.
libc.workspace = true
