[package]
name = "seismic-verify-quote"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Relying-party verification of Seismic node quotes against intended image measurements, and the CLI over it"

[lib]
name = "seismic_verify_quote"
path = "src/lib.rs"

[[bin]]
name = "verify-quote"
path = "src/main.rs"

[dependencies]
seismic-attestation.workspace = true
seismic-attestation-rpc.workspace = true

anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
jsonrpsee.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# The error-path tests hand `run` real files, since the failures under test are
# file-reading and file-parsing failures.
tempfile.workspace = true
