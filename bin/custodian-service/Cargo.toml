[package]
name = "seismic-custodian-service"
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Standalone service process for the Seismic key custodian"

# Binary target defaults to the package name (seismic-custodian-service),
# built from src/main.rs; the crate also exposes a lib (src/lib.rs) that the
# attestation-service integration tests drive directly.

[lints]
workspace = true

[dependencies]
seismic-custodian.workspace = true
seismic-network-manifest.workspace = true
# No `client` feature, so this binary links no tokio. See the CAUTION in
# crates/custodian-ipc/Cargo.toml.
seismic-custodian-ipc.workspace = true

anyhow.workspace = true
clap.workspace = true
hex.workspace = true
libc.workspace = true
rand.workspace = true
secp256k1.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Tests drive the served socket with the async client. Dev-only: resolver v2
# keeps dev-dep features out of `cargo build`, so the binary stays tokio-free.
seismic-custodian-ipc = { workspace = true, features = ["client"] }
tempfile.workspace = true
tokio.workspace = true
