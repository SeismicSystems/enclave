[package]
name = "seismic-attestation-service"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Seismic network-facing attestation service"

[lib]
name = "seismic_attestation_service"
path = "src/lib.rs"

[[bin]]
name = "seismic-attestation-service"
path = "src/main.rs"

[dependencies]
seismic-attestation.workspace = true
seismic-attestation-rpc.workspace = true
seismic-custodian-ipc = { workspace = true, features = ["client"] }
seismic-measurement-admission.workspace = true
seismic-measurement-registry-client.workspace = true

alloy.workspace = true
alloy-primitives.workspace = true
jsonrpsee.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
secp256k1.workspace = true
clap.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
url.workspace = true

[dev-dependencies]
# Used by the `capture_measurements` example to render guest measurements.
hex.workspace = true
# Integration tests pair each served instance with a real key custodian:
# the service crate's state/dispatch served over the ipc crate's socket server.
seismic-custodian-ipc = { workspace = true, features = ["server"] }
seismic-custodian.workspace = true
seismic-custodian-service.workspace = true
serial_test.workspace = true
tempfile.workspace = true
# Paused-clock tests: the admission retry sleeps must not cost wall time.
tokio = { workspace = true, features = ["test-util"] }
