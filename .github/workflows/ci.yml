name: CI

on:
  push:
    branches: [seismic]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  check_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The TPM stack (az-cvm-vtpm -> tss-esapi-sys, Linux-only via cfg) links
      # the native tpm2-tss libraries; GitHub-hosted runners don't ship them.
      - name: Install TPM build dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      # enclave-contract's multisig integration test spawns a local `anvil` and
      # builds the (plain Solidity) upgrade contracts with `forge`. Vanilla
      # foundry is enough: the contracts use no shielded types, so no Seismic
      # toolchain (sforge/sanvil) is needed — and sanvil would in fact break it,
      # since it forces every tx through the encrypted Seismic path.
      - name: Install foundry (forge + anvil)
        uses: foundry-rs/foundry-toolchain@v1
      - name: cargo check warnings
        run: RUSTFLAGS="-D warnings" cargo check
      # The workspace pass builds seismic-custodian-ipc with default features
      # only, which compiles out the `server` module (and its ACL tests) and
      # skips the `cli` binary entirely (required-features). Cover them here.
      - name: Run seismic-custodian-ipc tests (all features)
        run: cargo test -p seismic-custodian-ipc --all-features
      # Default test coverage for every workspace crate, so new crates get
      # tested without anyone remembering to add a job. Exclusions, each for
      # its own reason:
      #   - seismic-enclave / seismic-enclave-server: tests need root on a
      #     TDX CVM (vTPM/IMDS access); they have dedicated sudo jobs below.
      - name: Run workspace tests
        run: cargo test --workspace --exclude seismic-enclave --exclude seismic-enclave-server

  build:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # shared-key deliberately matches integration_tests, which restores this
      # job's cache instead of recompiling the workspace.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"
          cache-on-failure: true
      - name: cargo build without flags
        run: cargo build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enclave-binaries
          path: |
            target/debug/seismic-enclave*
            target/debug/seismic-enclave-server*
            target/debug/enclave-contract*
          retention-days: 1

  test_enclave:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests for seismic-enclave
        run: |
          cd crates/enclave
          OUTPUT=$(cargo test -p seismic-enclave --no-run 2>&1)
          echo "$OUTPUT"
          # Parse cargo's `Executable ... (path)` lines rather than grepping
          # for crate-named binaries: name greps silently skip standalone
          # tests/*.rs targets, whose binaries are named after the test file.
          mapfile -t binaries < <(echo "$OUTPUT" | sed -nE 's/^[[:space:]]*Executable .*\((.+)\)$/\1/p')
          [ ${#binaries[@]} -gt 0 ] || { echo "no test binaries found"; exit 1; }
          for binary in "${binaries[@]}"; do
            echo "Running binary: $binary"
            sudo "$binary"
          done

  test_enclave_server:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests for seismic-enclave-server
        run: |
          cd crates/enclave-server
          OUTPUT=$(cargo test -p seismic-enclave-server --no-run 2>&1)
          echo "$OUTPUT"
          # Parse cargo's `Executable ... (path)` lines rather than grepping
          # for crate-named binaries: name greps silently skip standalone
          # tests/*.rs targets, whose binaries are named after the test file.
          mapfile -t binaries < <(echo "$OUTPUT" | sed -nE 's/^[[:space:]]*Executable .*\((.+)\)$/\1/p')
          [ ${#binaries[@]} -gt 0 ] || { echo "no test binaries found"; exit 1; }
          for binary in "${binaries[@]}"; do
            case "$(basename "$binary")" in
              # tests/integration is the integration_tests job's payload:
              # run_integration_tests.sh runs it against the supervisor
              # devnet, which provides the network manifest that
              # enclave-server fatally requires at startup. It cannot pass
              # in this job's bare environment. Do NOT add further entries
              # here without a matching reason.
              integration-*)
                echo "SKIPPING $binary (integration_tests job's payload; needs the devnet)"
                continue
                ;;
            esac
            echo "Running binary: $binary"
            sudo "$binary"
          done

  integration_tests:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: build
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/

      # Download the built enclave binaries
      - name: Download enclave binaries
        uses: actions/download-artifact@v4
        with:
          name: enclave-binaries
          path: target/debug/

      # Make enclave binaries executable
      - name: Make enclave binaries executable
        run: |
          echo "current directory: $PWD"
          ls -la target/debug/seismic-*
          chmod +x target/debug/seismic-enclave*
          chmod +x target/debug/seismic-enclave-server*
          echo "Made enclave binaries executable:"
          ls -la target/debug/seismic-*

      # Checkout seismic-reth into subdir
      - name: Checkout seismic-reth
        uses: actions/checkout@v4
        with:
          repository: SeismicSystems/seismic-reth
          path: seismic-reth
          clean: false
          fetch-depth: 0

      # Build seismic-reth using manifest path
      # cargo sweep will delete files in target older than 1 day
      - name: Build seismic-reth
        run: |
          cargo install cargo-sweep
          cargo build --bin seismic-reth --manifest-path seismic-reth/Cargo.toml
          cargo sweep --time 1 --recursive
          echo "Current working directory: $PWD"
          echo "Full path of seismic-reth binary:"
          find $PWD/seismic-reth/target/debug -name "seismic-reth" -type f -executable -exec realpath {} \;

      # Checkout the current repo (enclave)
      - name: Checkout enclave repo
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      # Make integration test script executable
      - name: Make test script executable
        run: chmod +x scripts/run_integration_tests.sh

      # Debug: Check if binary exists and supervisor config
      - name: Debug binary and supervisor config
        run: |
          echo "=== Checking if seismic-reth binary exists ==="
          ls -la /home/azureuser/actions-runner/_work/enclave/enclave/seismic-reth/target/debug/seismic-reth || echo "Binary not found"
          echo "=== Checking if seismic-enclave-server binary exists ==="
          ls -la /home/azureuser/actions-runner/_work/enclave/enclave/target/debug/seismic-enclave-server || echo "seismic-enclave-server binary not found"
          echo "=== Current working directory ==="
          pwd
          echo "=== Supervisor config ==="
          sudo cat /etc/supervisor/conf.d/devnet.conf || echo "No supervisor config found"
          echo "=== Checking supervisor status ==="
          sudo supervisorctl status || echo "Supervisor not running"

      # Run the integration tests
      - name: Run integration tests
        run: ./scripts/run_integration_tests.sh

      - name: Cleanup artifacts from target
        run: |
          rm -rf target/debug/seismic-*
