name: CI

on:
  push:
    branches: [seismic]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install TPM build dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      - name: Build workspace and deny warnings
        run: RUSTFLAGS="-D warnings" cargo build --workspace

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The TPM stack (az-cvm-vtpm -> tss-esapi-sys, Linux-only via cfg) links
      # the native tpm2-tss libraries; GitHub-hosted runners don't ship them.
      - name: Install TPM build dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      # enclave-contract's multisig integration test spawns a local `anvil` and
      # builds the (plain Solidity) upgrade contracts with `forge`. Vanilla
      # foundry is enough: the contracts use no shielded types, so no Seismic
      # toolchain (sforge/sanvil) is needed — and sanvil would in fact break it,
      # since it forces every tx through the encrypted Seismic path.
      - name: Install foundry (forge + anvil)
        uses: foundry-rs/foundry-toolchain@v1
      # The workspace pass builds seismic-custodian-ipc with default features
      # only, which compiles out the `server` module (and its ACL tests) and
      # skips the `cli` binary entirely (required-features). Cover them here.
      - name: Run seismic-custodian-ipc tests (all features)
        run: cargo test -p seismic-custodian-ipc --all-features
      # The one live enclave-server integration target needs a TDX CVM and is
      # run separately below. Everything else can run on the hosted runner.
      - name: Run workspace tests
        run: cargo test --workspace --exclude seismic-enclave-server
      - name: Run enclave-server unit tests
        run: cargo test -p seismic-enclave-server --lib --bins

  integration_tests:
    runs-on: [self-hosted, linux, x64, azure-tdx-v6]
    # This runner has passwordless sudo and must never execute fork PR code.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # TODO: add a separate reth-backed integration job for contract-backed
      # bootstrap admission with PCR policy seeded in genesis.
      - name: Run integration tests
        run: ./scripts/run_integration_tests.sh
