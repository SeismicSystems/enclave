name: CI

on:
  push:
    branches: [seismic]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all --check

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install TPM build dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      - name: Build workspace and deny warnings
        run: RUSTFLAGS="-D warnings" cargo build --workspace

  # Everything hermetic given this commit's files: no built artifact and no
  # other repo, which is what lets this job serve as the required per-PR
  # check. The cross-repo checks against the MeasurementRegistry contract
  # (runtime-code hash, ABI, policy fixtures) run in the seismic repo, which
  # owns the contract and pins these crates, at the rev it pins
  # (https://github.com/SeismicSystems/seismic/blob/main/tee/cli/network/tests/enclave_pin.rs).
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The node binaries opt into seismic-attestation's `azure-attester`, whose
      # TPM stack (tss-esapi-sys, x86_64 linux only) links the native tpm2-tss
      # libraries; GitHub-hosted runners don't ship them.
      - name: Install TPM build dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      # The live seismic-attestation-service test targets (evidence,
      # admission) need a TDX CVM, and seismic-measurement-admission's
      # reth_registry test needs a seismic-reth binary; those run in their
      # own jobs. Everything else can run on the hosted runner.
      - name: Run workspace tests
        run: >-
          cargo test --workspace
          --exclude seismic-attestation-service
          --exclude seismic-measurement-admission
      - name: Run attestation-service unit tests
        run: cargo test -p seismic-attestation-service --lib --bins

  # Hosted, but dependent on a prebuilt artifact from another repo: the
  # reth_registry test boots a real seismic-reth dev node from the nightly
  # release binary. Its own job — outside the required `tests` check — so a
  # lagging or broken nightly surfaces here without blocking enclave merges.
  measurement_admission_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install TPM build dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      # The reth_registry integration test boots a real seismic-reth dev
      # node from a prebuilt nightly release binary.
      - id: sreth
        uses: SeismicSystems/seismic/.github/actions/setup-sreth@main
        with:
          version: nightly
      - name: Run measurement-admission tests
        env:
          SEISMIC_RETH_BIN: ${{ steps.sreth.outputs.seismic-reth-path }}
        run: cargo test -p seismic-measurement-admission

  # Both live-TEE suites in one job: the single TDX box serializes these
  # tests regardless (one runner, one vTPM), and the suites share most of
  # one dependency graph, so one job pays compilation once — the second
  # suite's cargo build is incremental in the same workspace. Test suites
  # run as separate steps, evidence first: it has no reth dependency, so
  # its results are in before the admission half touches the nightly
  # release binary.
  attestation_service_tdx_tests:
    runs-on: [self-hosted, linux, x64, azure-tdx-v6]
    # This runner has passwordless sudo and must never execute fork PR code.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The runner user reaches the raw TPM device (/dev/tpm0) through the
      # tss group — the runner's cloud-init assigns it there — so the tests
      # run unprivileged. Each target is one binary whose tests serialize on
      # the single vTPM through serial_test's in-process locks — nextest's
      # process-per-test model would need a max-threads = 1 test group to
      # keep that.
      - name: Run evidence tests
        env:
          RUST_LOG: info
          RUST_BACKTRACE: 1
        run: cargo test -p seismic-attestation-service --test evidence

      # The admission suite boots real seismic-reth dev nodes from a prebuilt
      # nightly release binary.
      - id: sreth
        uses: SeismicSystems/seismic/.github/actions/setup-sreth@main
        with:
          version: nightly
      - name: Run admission tests
        env:
          RUST_LOG: info
          RUST_BACKTRACE: 1
          SEISMIC_RETH_BIN: ${{ steps.sreth.outputs.seismic-reth-path }}
        run: cargo test -p seismic-attestation-service --test admission
