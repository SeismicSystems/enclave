name: CI

on:
  push:
    branches: [seismic]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install TPM build dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      - name: Build workspace and deny warnings
        run: RUSTFLAGS="-D warnings" cargo build --workspace

  # Everything hermetic given committed files: the hosted test suites plus
  # the cross-repo parity gates, which read files checked out from the
  # seismic repo's main branch — never a built artifact. Keeping built
  # artifacts out is what lets this job serve as the required per-PR check.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The TPM stack (az-cvm-vtpm -> tss-esapi-sys, Linux-only via cfg) links
      # the native tpm2-tss libraries; GitHub-hosted runners don't ship them.
      - name: Install TPM build dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      # Keep the Rust registry interfaces and the registry runtime-code pin tied
      # to the canonical artifact that feeds reth genesis, and the seismic
      # repo's copies of the two-record policy document and its compiled report
      # tied to the goldens. The artifact remains owned by the seismic repo and
      # the copied fixtures by this one; each side checks out the other's
      # committed file rather than trusting a local copy to stay current.
      - name: Check out seismic contracts artifact and fixture copies
        uses: actions/checkout@v4
        with:
          repository: SeismicSystems/seismic
          ref: main
          path: .context/seismic
          sparse-checkout: |
            contracts/artifacts/MeasurementRegistry.json
            contracts/test/fixtures
          sparse-checkout-cone-mode: false
      # The workspace pass builds seismic-custodian-ipc with default features
      # only, which compiles out the `server` module (and its ACL tests) and
      # skips the `cli` binary entirely (required-features). Cover them here.
      - name: Run seismic-custodian-ipc tests (all features)
        run: cargo test -p seismic-custodian-ipc --all-features
      # The live seismic-attestation-service test targets (evidence,
      # admission) need a TDX CVM, and seismic-measurement-admission's
      # reth_registry test needs a seismic-reth binary; those run in their
      # own jobs. Everything else can run on the hosted runner.
      - name: Run workspace tests
        run: >-
          cargo test --workspace
          --exclude seismic-attestation-service
          --exclude seismic-measurement-admission
      # Both parity targets read the same artifact and need no seismic-reth
      # binary, so they run here rather than in measurement_admission_tests:
      # the client's runtime read binding, and the admission crate's full
      # protocol interface plus its registry runtime-code pin.
      - name: Check MeasurementRegistry ABI parity
        env:
          MEASUREMENT_REGISTRY_ARTIFACT: ${{ github.workspace }}/.context/seismic/contracts/artifacts/MeasurementRegistry.json
        run: >-
          cargo test -p seismic-measurement-registry-client --test abi_parity -- --ignored
          && cargo test -p seismic-measurement-admission --test registry_abi -- --ignored
      # The seismic repo's Solidity fixture tests run against a committed copy
      # of two of this crate's golden fixtures; regenerating them must
      # fail here until that copy is updated in step.
      - name: Check measurement-policy fixture parity
        env:
          SEISMIC_CONTRACTS_FIXTURES: ${{ github.workspace }}/.context/seismic/contracts/test/fixtures
        run: cargo test -p seismic-measurement-admission --test fixture_parity -- --ignored
      - name: Run attestation-service unit tests
        run: cargo test -p seismic-attestation-service --lib --bins

  # Hosted, but dependent on a prebuilt artifact from another repo: the
  # reth_registry test boots a real seismic-reth dev node from the nightly
  # release binary. Its own job — outside the required `tests` check — so a
  # lagging or broken nightly surfaces here without blocking enclave merges.
  measurement_admission_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install TPM build dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      # The reth_registry integration test boots a real seismic-reth dev
      # node from a prebuilt nightly release binary.
      - id: sreth
        uses: SeismicSystems/seismic/.github/actions/setup-sreth@main
        with:
          version: nightly
      - name: Run measurement-admission tests
        env:
          SEISMIC_RETH_BIN: ${{ steps.sreth.outputs.seismic-reth-path }}
        run: cargo test -p seismic-measurement-admission

  # Both live-TEE suites in one job: the single TDX box serializes these
  # tests regardless (one runner, one vTPM), and the suites share most of
  # one dependency graph, so one job pays compilation once — the second
  # suite's cargo build is incremental in the same workspace. Test suites
  # run as separate steps, evidence first: it has no reth dependency, so
  # its results are in before the admission half touches the nightly
  # release binary.
  attestation_service_tdx_tests:
    runs-on: [self-hosted, linux, x64, azure-tdx-v6]
    # This runner has passwordless sudo and must never execute fork PR code.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run evidence tests
        run: ./scripts/run_attestation_service_evidence_tdx_tests.sh

      # The admission suite boots real seismic-reth dev nodes from a prebuilt
      # nightly release binary.
      - id: sreth
        uses: SeismicSystems/seismic/.github/actions/setup-sreth@main
        with:
          version: nightly
      - name: Run admission tests
        env:
          SEISMIC_RETH_BIN: ${{ steps.sreth.outputs.seismic-reth-path }}
        run: ./scripts/run_attestation_service_admission_tdx_tests.sh
