[package]
name = "seismic-measurement-admission"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
description = "Admission-ID derivation and measurement-policy compiler for the on-chain MeasurementRegistry"

[dependencies]
alloy-primitives.workspace = true
clap = { workspace = true, optional = true }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
attestation.workspace = true

[features]
# The policy-compiler CLI shelled out to by non-Rust deploy tooling; Rust
# consumers (responder/joiner adapters, a future Rust deploy CLI) link the
# library directly.
cli = ["dep:clap"]

[[bin]]
name = "seismic-measurement-admission"
path = "src/main.rs"
required-features = ["cli"]
