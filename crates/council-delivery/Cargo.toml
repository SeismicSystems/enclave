[package]
name = "seismic-council-delivery"
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Wire types, binding digests, and envelope crypto for security-council epoch-key deliveries"

# Shared by the centralized custodian (opening envelopes) and off-node council
# signer tooling (sealing them), so it stays a leaf: no custodian, attestation,
# or async dependencies.

[dependencies]
alloy-primitives.workspace = true
anyhow.workspace = true
ciborium.workspace = true
hex.workspace = true
secp256k1.workspace = true
seismic-network-manifest.workspace = true
serde.workspace = true
serde_bytes.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize = { workspace = true, features = ["derive"] }

# `cli` feature: the council-signer ceremony tool.
clap = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
# Shared synchronous client, also used by observer custodians.
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[features]
http-client = ["dep:ureq", "dep:url"]
cli = [
    "dep:clap",
    "dep:rand",
    "dep:toml",
    "http-client",
]

[[bin]]
name = "council-signer"
required-features = ["cli"]

[dev-dependencies]
serde_json.workspace = true
tiny_http.workspace = true
tempfile = "3.17.1"
# Local HTTPS fixture: prove the production client rejects untrusted certificates.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
