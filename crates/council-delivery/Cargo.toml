[package]
name = "seismic-council-delivery"
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Wire types, binding digests, and envelope crypto for security-council epoch-key deliveries"

# Shared by the centralized custodian (opening envelopes) and off-node council
# signer tooling (sealing them), so it stays a leaf: no custodian, attestation,
# or async dependencies.

[dependencies]
alloy-primitives.workspace = true
anyhow.workspace = true
ciborium.workspace = true
hex.workspace = true
secp256k1.workspace = true
seismic-network-manifest.workspace = true
serde.workspace = true
serde_bytes.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize = { workspace = true, features = ["derive"] }

# `cli` feature: the council-signer ceremony tool.
clap = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
# TLS client so the tool can reach nodes fronted by a TLS terminator
# (nginx `stream`, stunnel). Off-node tooling only — nothing key-holding
# links these.
rustls = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
# Raw path dep so default features (tokio via `client`) stay off; only the
# core wire framing is linked.
seismic-custodian-ipc = { path = "../custodian-ipc", default-features = false, optional = true }

[features]
cli = [
    "dep:clap",
    "dep:rand",
    "dep:rustls",
    "dep:toml",
    "dep:webpki-roots",
    "dep:seismic-custodian-ipc",
]

[[bin]]
name = "council-signer"
required-features = ["cli"]

[dev-dependencies]
serde_json.workspace = true
