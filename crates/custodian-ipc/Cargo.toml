[package]
name = "seismic-custodian-ipc"
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Wire protocol, client, and server for the Seismic custodian Unix socket"

[dependencies]
ciborium.workspace = true
libc.workspace = true
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize = { workspace = true, features = ["derive"] }

# Optional so the custodian links no async runtime.
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
# `client` is the async CustodianClient. Off by default so the custodian, which
# must not link tokio, gets it only if someone asks for it.
#
# CAUTION: cargo unifies features per build, so building the custodian together
# with a `client` consumer (e.g. --workspace) pulls tokio back in. Build it on
# its own.
client = ["dep:tokio"]
