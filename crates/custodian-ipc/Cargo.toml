[package]
name = "seismic-custodian-ipc"
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Wire protocol, client, and server for the Seismic custodian Unix socket"

[dependencies]
ciborium.workspace = true
libc.workspace = true
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize = { workspace = true, features = ["derive"] }

# Optional so the custodian links no async runtime.
tokio = { workspace = true, optional = true }

# `cli` feature: debug binary.
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
# `client` is the async CustodianClient. On by default for reth; the workspace
# root turns default features off so the custodian builds without tokio.
#
# CAUTION: cargo unifies features per build, so building the custodian together
# with a `client` consumer (e.g. --workspace) pulls tokio back in. Build it on
# its own.
default = ["client"]
client = ["dep:tokio"]
cli = ["client", "dep:anyhow", "dep:clap", "dep:hex", "dep:sha2"]

[[bin]]
name = "custodian-ipc-cli"
required-features = ["cli"]
