[package]
name = "seismic-observer-key"
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Additive ed25519 observer-key derivation, ported byte-exact from summit"

# Byte-exact port of summit's `types/src/ext_private_key.rs` (additive ed25519
# child derivation), pinned by golden vectors generated from summit itself.
# Deliberately a leaf with no summit dependency: pulling `summit-types` in
# would drag tokio/alloy/commonware into the async-free custodian binary.

[dependencies]
anyhow.workspace = true
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize = { workspace = true, features = ["derive"] }

# `cli` feature: the observer-keytool ops helper.
clap = { workspace = true, optional = true }

[features]
cli = ["dep:clap"]

[[bin]]
name = "observer-keytool"
required-features = ["cli"]

[dev-dependencies]
rand.workspace = true
